receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

  debug:

  otlp_grpc:
    endpoint: jaeger-all-in-one:4317
    tls:
      insecure: true

processors:
  batch:


service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp_grpc]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]